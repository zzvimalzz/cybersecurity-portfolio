career:
  statement: |
    My target role is **Penetration Tester**, building on my software engineering background.

    I want to work on systems where security decisions have real consequences, and to be the engineer who finds weaknesses before an attacker does. So far I have practised on my own lab and legal platforms. The gap I need to close next is written penetration test reports.
  steps:
    - Complete the Master of Cybersecurity at Universiti Malaya (by September 2027) and use coursework to produce public, evidence-based project write-ups here.
    - Earn CompTIA Security+ by 31 August 2027.
    - Practise on TryHackMe and HackTheBox, and publish a written practice penetration test report here for each project.

journey:
  - title: TCP handshakes, port states and Nmap
    body: |
      In the Wireshark handshake lab (9.2.6) and the Nmap lab (9.3.8) I learned to read the SYN, SYN/ACK and ACK flags, and what Nmap concludes from them. WQE7002 Topic 4 made the key point: a scanner does not read a target, it infers from responses.

      I turned that into code when I wrote vscan, a Scapy scanner that sends its own SYN probes. It reports four states: open, closed, filtered by an ICMP reply, and no response. A silent port is never called closed, because silence proves nothing.
  - title: Scope and defensible evidence
    body: |
      WQE7002 Topics 4 to 6 treated authorisation and evidence as part of the technique. A scan needs written scope before the first probe, and a capture only shows what crossed one point at one time.

      I built both ideas into vscan. It refuses any target, port count or rate outside a scope file. My lab run kept a packet capture, the scanner's result and Nmap's own XML, so each claim has a file behind it. This changed how I write: every result in this portfolio links to its evidence. Without that habit, my Nmap comparison would have been a claim instead of a result.
  - title: What went wrong
    body: |
      My capture of the lab scan showed eight reset packets, but vscan reported sending four. I had to find out whether my code or something else sent the extra four.

      Four resets arrived 51 to 55 ms after each SYN/ACK, which matched my rate limit. The other four came under a millisecond after, with IP ID 0 and the Don't Fragment flag, which my packets do not carry. Three repeat runs gave the same split. With my resets switched off, four still appeared, and a plain Nmap scan showed them too. The lab machine's kernel was sending them. My planned fix is to block the kernel's automatic reset during a scan.
  - title: What I still find challenging
    body: |
      Active Directory and Windows network attacks. My lab work so far is Linux hosts and single services, so I have little hands-on practice with domain controllers, authentication and lateral movement. Job postings for penetration testers ask for it, so I treat it as my biggest gap.

      My scanner has a similar gap. Closed, filtered and ICMP results were only tested in simulation, because every port in the lab was open. I plan to practise on TryHackMe and HackTheBox to close both.
  - title: Improvement goal
    body: |
      I will pass CompTIA Security+ by 31 August 2027. I will study with Professor Messer's free course and practice exams, and I will measure success by the exam result: a pass by that date. It closes the first gap I named in my Pathway assignment: no recognised security certification.

      After that, my next target is to publish practice penetration test reports here.
