about: |
  I'm Vimal, a software engineer based in Kuala Lumpur, Malaysia, and a Master of Cybersecurity student at Universiti Malaya (from October 2026). I hold a BSc (Hons) in Computer Science specialising in Cyber Security from SEGi University and completed the Google Cybersecurity Certificate in 2025. Before the Master's, I built backend systems for enterprise platforms where the data is money-critical and downtime carries an SLA: APIs, batch pipelines, integrations and production incident response. I now run [Swymble](https://swymble.com), a one-person studio and lab where I deliver client builds end to end and make my own products, including offline-first apps that use end-to-end encryption and Ed25519 signing. That mix is why I care about security. I have seen what happens when systems handle real money and real users, and I want to build and defend them properly. I'm studying cybersecurity to move from writing secure code towards testing it as a penetration tester.

